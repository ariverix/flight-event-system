name: CI

# Промышленный CI-пайплайн (P0-1, RUN_PLAN.md; Фаза 7 прогона 2026-07-03 — фронтенд/E2E/docker):
#   backend:  build -> test (включает ApplicationModules.verify(), см. ModularityTests) ->
#             JaCoCo coverage gate (baseline-порог, см. комментарий в backend/pom.xml) ->
#             license report зависимостей (P0-6, информационный, не блокирует сборку) -> package
#   frontend: install -> typecheck -> lint -> vitest -> build (ГЕЙТ с Фазы 7 — без continue-on-error)
#   e2e:      Playwright smoke против реального стека (postgres service + backend jar + vite dev)
#   docker:   build образов backend/frontend + helm lint (build-only: секрет registry не задан,
#             см. BLOCKERS.md «Push docker-образов в registry»)
#
# PR не должен мёржиться без зелёных jobs `backend`, `frontend`, `e2e`.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (build, test, Modulith-verify, coverage gate)
    runs-on: ubuntu-latest

    # БД для интеграционных тестов: BaseIntegrationTest подключается к
    # jdbc:postgresql://localhost:5432/eca_test (eca_user/eca_password) напрямую,
    # без Testcontainers. Поэтому поднимаем сервис-контейнер Postgres с теми же
    # именем БД/учётными данными, что и в локальной разработке (см. docker-compose.yml).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: eca_test
          POSTGRES_USER: eca_user
          POSTGRES_PASSWORD: eca_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eca_user -d eca_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Grant execute permission to mvnw
        working-directory: backend
        run: chmod +x mvnw

      - name: Build, test, Modulith-verify, coverage gate (mvn verify)
        working-directory: backend
        # mvn verify прогоняет: compile -> test (включая ModularityTests,
        # ApplicationModules.verify()) -> jacoco:report -> jacoco:check (coverage gate) -> package.
        # Профиль windows-docker в pom.xml активируется только под Windows и здесь не подключается —
        # отдельный DOCKER_HOST не требуется, т.к. интеграционные тесты используют реальный
        # сервис-контейнер Postgres выше, а не Testcontainers container-launch API.
        # mvnw запускается через `bash mvnw`, а не `./mvnw` — файл в репозитории имеет CRLF-окончания
        # строк (создан на Windows), что ломает прямой запуск шебанга `#!/bin/sh` на Linux-раннере.
        run: bash mvnw -B verify
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/eca_test
          SPRING_DATASOURCE_USERNAME: eca_user
          SPRING_DATASOURCE_PASSWORD: eca_password

      # LOW backlog (docs/PROGRESS.md): job `e2e` раньше пересобирал тот же jar с нуля
      # (-DskipTests package) параллельно этому job'у — двойная сборка, дороже по CI-минутам.
      # Публикуем уже собранный здесь jar как артефакт; `e2e` теперь `needs: backend` и просто
      # скачивает его. Компромисс: e2e стартует только после зелёного backend (было — параллельно),
      # т.е. чуть больше wall-clock на PR, зато один build вместо двух.
      - name: Upload backend jar (for e2e job)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-jar
          path: backend/target/eca-system-*.jar
          retention-days: 1
          if-no-files-found: error

      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: jacoco-report
          path: backend/target/site/jacoco/
          retention-days: 14

      - name: Upload surefire test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: surefire-reports
          path: backend/target/surefire-reports/
          retention-days: 14

      # License report зависимостей (P0-6, RUN_PLAN.md): информационный отчёт по
      # лицензиям всех (включая транзитивных) Maven-зависимостей backend, для
      # compliance/Реестра российского ПО (см. docs/security/fstec-checklist.md).
      # Генерируется goal'ом license-maven-plugin, привязанным к фазе verify в
      # backend/pom.xml — уже выполнился в составе предыдущего шага `mvn verify`,
      # здесь только публикуем готовый артефакт. Не фейлит сборку по лицензиям —
      # политику запрещённых/разрешённых лицензий вводит compliance отдельным тикетом.
      - name: Upload dependency license report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: license-report
          path: backend/target/site/aggregate-third-party-report.html
          retention-days: 90

  security-scan:
    name: Security scan (OWASP Dependency-Check, SpotBugs/FindSecBugs, Semgrep)
    runs-on: ubuntu-latest
    # P4-4 (RUN_PLAN.md): фейл сборки на High/Critical. Отдельный job — сканы медленные
    # (Dependency-Check скачивает базу NVD) и не должны замедлять основной backend-гейт.
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Grant execute permission to mvnw
        working-directory: backend
        run: chmod +x mvnw

      # OWASP Dependency-Check: CVE в зависимостях, фейл при CVSS >= 7 (см. backend/pom.xml,
      # профиль security-scan, failBuildOnCVSS=7). NVD_API_KEY — repo secret (бесплатный ключ
      # NVD; без него обновление базы жёстко rate-limited). Кэшируем базу NVD между запусками.
      - name: Cache NVD data
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: nvd-${{ runner.os }}
          restore-keys: nvd-${{ runner.os }}

      - name: OWASP Dependency-Check (fail on CVSS>=7)
        working-directory: backend
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: bash mvnw -B -Psecurity-scan dependency-check:check

      # SpotBugs + FindSecBugs: SAST байткода, фейл на security-находках (см. spotbugs-security-include.xml).
      - name: SpotBugs + FindSecBugs (security)
        working-directory: backend
        run: bash mvnw -B -Psecurity-scan -DskipTests compile spotbugs:check

      # Semgrep: SAST исходников, правила Java + OWASP Top Ten; --error фейлит на находках.
      # Используем semgrep/semgrep-action (canonical имя после ребрендинга из returntocorp).
      - name: Semgrep SAST
        uses: semgrep/semgrep-action@713efdd345f3035192eaa63f56867b88e63e4e5d # v1
        with:
          config: >-
            p/java
            p/owasp-top-ten
            p/secrets

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: security-reports
          path: |
            backend/target/dependency-check-report.html
            backend/target/dependency-check-report.json
            backend/target/spotbugsXml.xml
          retention-days: 30

  frontend:
    name: Frontend (typecheck, lint, vitest, build)
    runs-on: ubuntu-latest
    # Фаза 7: job — полноценный гейт (continue-on-error снят), добавлены lint и vitest
    # (до этого 200+ фронтенд-тестов в CI не гонялись вовсе).

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Node.js 20 LTS
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Type-check
        working-directory: frontend
        run: npm run check

      - name: Lint (ESLint, 0 errors; warnings — baseline, не гейт)
        working-directory: frontend
        run: npm run lint

      - name: Unit/component tests (vitest)
        working-directory: frontend
        run: npm run test:run

      - name: Build
        working-directory: frontend
        run: npm run build

  e2e:
    name: E2E (Playwright smoke против реального стека)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: backend
    # Фаза 7: сквозной smoke (frontend/e2e/*, 6 сценариев) против реального backend + Postgres.
    # Схема: postgres (service) -> backend jar (Flyway мигрирует чистую БД, демо admin/admin из V8)
    # -> Playwright сам поднимает vite dev :5173 (webServer в playwright.config.ts), прокси /api -> :8080.
    # Тесты backend здесь НЕ гоняются (это гейт job `backend`) — jar скачивается уже собранным
    # оттуда (`needs: backend`, LOW backlog из docs/PROGRESS.md — раньше пересобирался с нуля
    # -DskipTests package параллельно job'у `backend`, двойная сборка дороже по CI-минутам).

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: eca_test
          POSTGRES_USER: eca_user
          POSTGRES_PASSWORD: eca_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eca_user -d eca_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        # без cache: maven — job больше не запускает mvn (jar скачивается готовым, см. ниже),
        # JDK нужен только чтобы выполнить `java -jar`.
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node.js 20 LTS
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Download backend jar (built by job `backend`)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: backend-jar
          path: backend/target

      - name: Start backend (background)
        working-directory: backend
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/eca_test
          SPRING_DATASOURCE_USERNAME: eca_user
          SPRING_DATASOURCE_PASSWORD: eca_password
        run: |
          # Явный паттерн вместо target/*.jar: локальный -Psecurity-scan оставляет в target
          # посторонний findsecbugs-plugin-*.jar — глоб не должен его захватывать.
          nohup java -jar target/eca-system-*.jar > "$GITHUB_WORKSPACE/backend-e2e.log" 2>&1 &

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers (chromium)
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      # Readiness (P5-3, permitAll для k8s-проб) включает БД и интеграционные каналы —
      # честный сигнал «стек готов принимать E2E-трафик».
      - name: Wait for backend readiness
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/actuator/health/readiness > /dev/null; then
              echo "backend ready after ~$((i*2))s"; exit 0
            fi
            sleep 2
          done
          echo "::error::backend не поднялся за 120с"; tail -n 100 backend-e2e.log; exit 1

      - name: Run Playwright E2E
        working-directory: frontend
        run: npx playwright test

      - name: Upload Playwright artifacts (traces, screenshots, videos)
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-artifacts
          path: |
            frontend/test-results/
            frontend/playwright-report/
          retention-days: 14

      - name: Upload backend log
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-e2e-log
          path: backend-e2e.log
          retention-days: 14

  docker:
    name: Docker build + Helm lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Фаза 7: сборка обоих образов (multi-stage и non-root — уже из P8-1) + helm lint.
    # BUILD-ONLY: секрет registry не задан — push отсутствует осознанно
    # (см. BLOCKERS.md «Push docker-образов в registry (Фаза 7)»). При появлении секрета:
    # docker/login-action + docker push + тег из github.sha.

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Build backend image
        run: docker build -t eca-backend:${{ github.sha }} backend

      - name: Build frontend image
        run: docker build -t eca-frontend:${{ github.sha }} frontend

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4

      - name: Helm lint (default + staging + prod values)
        run: |
          helm lint deploy/helm/eca-system
          helm lint deploy/helm/eca-system -f deploy/helm/eca-system/values-staging.yaml
          helm lint deploy/helm/eca-system -f deploy/helm/eca-system/values-prod.yaml
