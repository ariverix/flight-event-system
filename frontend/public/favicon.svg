<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- Background rounded rect -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- Glass highlight -->
  <rect x="4" y="4" width="56" height="28" rx="10" fill="url(#glow)"/>
  <!-- Airplane icon (centered) -->
  <g transform="translate(32,32) rotate(-30)" fill="white" opacity="0.95">
    <!-- fuselage -->
    <ellipse cx="0" cy="0" rx="3" ry="14" fill="white"/>
    <!-- wings -->
    <polygon points="-14,4 14,4 5,-1 -5,-1" fill="white"/>
    <!-- tail -->
    <polygon points="-7,10 7,10 3,5 -3,5" fill="white"/>
  </g>
</svg>
