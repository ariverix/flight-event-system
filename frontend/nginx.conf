server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── SPA-роутинг ────────────────────────────────────────────────────────────
    # React Router (react-router-dom v7) управляет маршрутами на клиенте.
    # Все пути, для которых нет физического файла, отдают index.html.
    # Статические файлы Vite (assets/) обслуживаются напрямую.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Runtime environment ─────────────────────────────────────────────────────
    # env.js генерируется entrypoint.sh из ENV-переменных контейнера.
    # В K8s монтируется из ConfigMap (subPath) — entrypoint.sh не перезаписывает.
    # Не кешируется: при рестарте pod'а (смена конфига) браузер получает свежее значение.
    location = /env.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # ── Статические ассеты Vite ─────────────────────────────────────────────────
    # Vite добавляет content-hash к именам файлов (main.AbCdEfGh.js).
    # Cache-Control: immutable → браузер не проверяет свежесть файла год.
    location ~* \.(js|css|woff|woff2|ttf|eot|otf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        access_log off;
    }

    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp)$ {
        expires 30d;
        add_header Cache-Control "public" always;
        access_log off;
    }

    # ── Kubernetes health probes ────────────────────────────────────────────────
    # livenessProbe и readinessProbe в Deployment ссылаются на /healthz.
    # Не логируем (шум в access.log).
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain always;
    }

    # ── Security headers ────────────────────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── Gzip-сжатие ────────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml
        font/woff
        font/woff2;
}
