{{- if .Values.postgresql.enabled -}}
# PVC для PostgreSQL данных.
# Создаётся независимо от StatefulSet — данные сохраняются при пересоздании StatefulSet
# (helm uninstall → helm install не уничтожает данные).
# Для полного удаления данных: kubectl delete pvc <fullname>-postgres-data
# (шаблонные выражения в YAML-комментариях Helm всё равно исполняет — не использовать)
#
# В prod postgresql.enabled=false — этот PVC не создаётся (внешняя управляемая БД).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "eca-system.fullname" . }}-postgres-data
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "eca-system.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
  annotations:
    # Сохранить PVC при helm uninstall (защита данных)
    helm.sh/resource-policy: keep
spec:
  accessModes:
    - ReadWriteOnce
  {{- if .Values.postgresql.storage.storageClass }}
  storageClassName: {{ .Values.postgresql.storage.storageClass | quote }}
  {{- else if eq .Values.postgresql.storage.storageClass "" }}
  # Пустой storageClassName → использовать default StorageClass кластера
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.postgresql.storage.size }}
{{- end }}
