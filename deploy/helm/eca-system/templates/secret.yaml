# Secret с DB credentials (url/username/password).
# Имя: {{ fullname }}-db (или backend.dbSecretName если задан явно).
#
# ВАЖНО: helm.sh/resource-policy: keep — Secret не удалится при helm uninstall.
# Это защита от случайной потери credentials при обновлении чарта.
# При полном удалении окружения Secret нужно удалить вручную:
#   kubectl delete secret {{ fullname }}-db {{ fullname }}-jwt
#
# В prod рекомендуется использовать External Secrets Operator или Vault Agent Injector
# и задать backend.dbSecretName / backend.jwtSecretName для уже существующих Secret'ов.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "eca-system.dbSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "eca-system.labels" . | nindent 4 }}
  annotations:
    # Сохранить Secret при helm uninstall (защита данных)
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- if .Values.postgresql.enabled }}
  {{- /* Dev/test: используем встроенный PostgreSQL StatefulSet */}}
  url: {{ printf "jdbc:postgresql://%s:5432/%s" (include "eca-system.postgresServiceName" .) .Values.postgresql.auth.database | b64enc | quote }}
  username: {{ .Values.postgresql.auth.username | b64enc | quote }}
  password: {{ .Values.postgresql.auth.password | b64enc | quote }}
  {{- else }}
  {{- /* Staging/prod: внешняя управляемая БД */}}
  url: {{ required "externalDatabase.url обязателен когда postgresql.enabled=false" .Values.externalDatabase.url | b64enc | quote }}
  username: {{ required "externalDatabase.username обязателен когда postgresql.enabled=false" .Values.externalDatabase.username | b64enc | quote }}
  password: {{ required "externalDatabase.password обязателен когда postgresql.enabled=false (передать через --set)" .Values.externalDatabase.password | b64enc | quote }}
  {{- end }}
---
# Secret с JWT-ключом для подписи токенов.
# Имя: {{ fullname }}-jwt (или backend.jwtSecretName если задан явно).
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "eca-system.jwtSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "eca-system.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  # Ключ подписи JWT. Минимум 256 бит. В prod передать через --set jwt.secret=VALUE
  secret: {{ required "jwt.secret обязателен (минимум 32 символа)" .Values.jwt.secret | b64enc | quote }}
