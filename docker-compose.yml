services:
  postgres:
    image: postgres:16-alpine
    container_name: eca-postgres
    environment:
      POSTGRES_DB: eca_db
      POSTGRES_USER: eca_user
      POSTGRES_PASSWORD: eca_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eca_user -d eca_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eca-app
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/eca_db
      SPRING_DATASOURCE_USERNAME: eca_user
      SPRING_DATASOURCE_PASSWORD: eca_password
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  postgres_data:
