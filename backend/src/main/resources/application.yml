spring:
  application:
    name: eca-system

  datasource:
    # P4-3: секреты вынесены в окружение. Значения после ':' — ТОЛЬКО dev-дефолты для
    # локального запуска/тестов; в проде ОБЯЗАТЕЛЬНО переопределяются env/secret-manager'ом
    # (см. docs/security/secrets-management.md).
    url: ${DB_URL:jdbc:postgresql://localhost:5432/eca_db}
    username: ${DB_USERNAME:eca_user}
    password: ${DB_PASSWORD:eca_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: false
    out-of-order: true

  modulith:
    events:
      jdbc:
        schema-initialization:
          enabled: true
      # P1-7 / ADR-0002 (docs/adr/ADR-0002-transactional-outbox-vs-direct-call.md):
      # without this flag, an event_publication row left with completion_date IS NULL
      # after a process crash/restart is NEVER retried automatically — Transactional
      # Outbox would only guarantee atomicity, not at-least-once delivery across restarts.
      # Property verified against spring-modulith-events-core 1.3.1
      # META-INF/spring-configuration-metadata.json: the namespace moved from
      # spring.modulith.republish-outstanding-events-on-restart (deprecated since 1.3,
      # removal planned in 1.4) to spring.modulith.events.republish-outstanding-events-on-restart.
      republish-outstanding-events-on-restart: true
      # Явно фиксируем completion-mode=update (это и текущий default 1.3.1, см. та же
      # spring-configuration-metadata.json) — завершённая публикация ОСТАЁТСЯ строкой с
      # заполненным completion_date, а не удаляется (DELETE). Это сделано для аудита: хотя
      # event_publication — внутренний реестр доставки Modulith, а не бизнес Event Log
      # класса Tracking (CLAUDE.md) и не источник данных для него, оставление записей
      # позволяет диагностировать прошедшие доставки без отдельного журнала. TTL-очистка
      # таблицы — эксплуатационная задача вне объёма P1-7 (см. ADR-0002, "Что НЕ входит").
      completion-mode: update

server:
  port: 8080

logging:
  structured:
    format:
      console: ${LOG_STRUCTURED_FORMAT:ecs}

management:
  endpoints:
    web:
      exposure:
        # P5-1: + prometheus (scrape-эндпоинт). /actuator/** за RBAC SYSTEM_ADMIN (P4-1),
        # /actuator/health открыт (см. SecurityConfig).
        include: health,info,metrics,prometheus
  metrics:
    tags:
      application: eca-system
    distribution:
      # P5-1: гистограммы перцентилей для таймеров латентности обработки (p95/p99 в Prometheus).
      percentiles-histogram:
        eca.execution.event.duration: true
      percentiles:
        eca.execution.event.duration: 0.95, 0.99
  endpoint:
    health:
      show-details: always
  info:
    # P4-3: не публиковать env-производные свойства через /actuator/info (минимизация раскрытия;
    # сам actuator уже за RBAC SYSTEM_ADMIN, но info.env — лишняя поверхность).
    env:
      enabled: false
  # P5-2: сквозная трассировка OpenTelemetry (входящее сообщение -> движок ECA -> исходящее).
  tracing:
    enabled: true
    sampling:
      # Доля сэмплируемых трейсов — настраиваемая (TRACING_SAMPLING_PROBABILITY), дефолт 1.0
      # (100%) для дев/тестов и текущего масштаба нагрузки; на проде с высоким throughput
      # понизить через env без пересборки (см. docs/perf для целевых msg/s, P2-7).
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  otlp:
    tracing:
      # Импортозамещение (CLAUDE.md): экспорт ТОЛЬКО по OTLP в самостоятельно разворачиваемый
      # коллектор (напр. собственный OpenTelemetry Collector) — без зарубежных проприетарных
      # SaaS. endpoint берётся из env (прод/стейджинг указывают реальный коллектор и явно
      # включают export через OTLP_TRACING_ENABLED=true).
      #
      # Экспорт ВЫКЛЮЧЕН по умолчанию (export.enabled=false) — дев-машина/CI/тесты не держат
      # локальный коллектор на 4318; без этого фоновый BatchSpanProcessor шумел бы
      # connection-refused в логах и тянул бы внешнюю зависимость в сборку/тесты. Сам трейсинг
      # (management.tracing.*, создание span'ов) НЕ выключается этим флагом — он управляется
      # отдельно и виден в тестах через InMemorySpanExporter (см. observability/InMemoryTracingTestConfig).
      endpoint: ${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
      export:
        enabled: ${OTLP_TRACING_ENABLED:false}

info:
  app:
    name: ECA System
    description: Event-Condition-Action system for aviation message processing
    version: 1.0.0

app:
  jwt:
    # P4-3: dev-дефолт ниже — НЕ для прода. В проде задать JWT_SECRET (≥256 бит) через
    # env/secret-manager (см. docs/security/secrets-management.md). Утечка этого ключа =
    # подделка любого access-токена.
    secret: ${JWT_SECRET:eca-jwt-secret-key-for-development-minimum-256-bits-long}
    # P4-2: короткоживущий access-токен (15 мин) + долгоживущий refresh с ротацией (7 дней)
    expiration-ms: ${JWT_EXPIRATION_MS:900000}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}
