spring:
  application:
    name: eca-system

  datasource:
    url: jdbc:postgresql://localhost:5432/eca_db
    username: eca_user
    password: eca_password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  modulith:
    events:
      jdbc:
        schema-initialization:
          enabled: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
  info:
    env:
      enabled: true

info:
  app:
    name: ECA System
    description: Event-Condition-Action system for aviation message processing
    version: 1.0.0

app:
  jwt:
    secret: eca-jwt-secret-key-for-development-minimum-256-bits-long
    expiration-ms: 86400000
